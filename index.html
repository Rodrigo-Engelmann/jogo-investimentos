<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0e0c" />
    <title>Grana Viva</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0e0e0c;
        --p: #17170f;
        --p2: #222216;
        --line: #3a3a26;
        --y: #ffd400;
        --g: #3ddc84;
        --r: #ff4d4d;
        --t: #f6f3e4;
        --m: #9a977f;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: var(--ink);
        color: var(--t);
        font:
          14px/1.45 "DM Sans",
          system-ui,
          sans-serif;
        padding-bottom: 104px;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }

      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
      }

      .w {
        max-width: 480px;
        margin: auto;
        padding: 0 16px;
      }

      header {
        display: flex;
        align-items: center;
        padding: 14px 0 10px;
      }

      .brand {
        font: 20px "Bowlby One";
        letter-spacing: -0.5px;
        flex: 1;
      }

      .brand em {
        font-style: normal;
        color: var(--y);
        margin-left: 6px;
      }

      .date {
        text-align: right;
        line-height: 1.15;
      }

      .date b {
        font: 15px "Bowlby One";
      }

      .date span {
        display: block;
        font-size: 11px;
        color: var(--m);
      }

      .ib {
        width: 36px;
        height: 36px;
        border: 2px solid var(--line);
        border-radius: 10px;
        margin-left: 10px;
        font-size: 16px;
      }

      .prog {
        height: 6px;
        background: var(--p2);
        border-radius: 9px;
        overflow: hidden;
        margin-bottom: 14px;
      }

      .prog i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--y);
        transition: width 0.3s;
      }

      .hero {
        background: var(--y);
        color: var(--ink);
        border-radius: 20px;
        padding: 16px 16px 12px;
        box-shadow: 5px 5px 0 #7a6700;
      }

      small.k {
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.14em;
        opacity: 0.7;
        display: block;
      }

      .big {
        font: 44px/1.05 "Bowlby One";
        letter-spacing: -1.5px;
        font-variant-numeric: tabular-nums;
        position: relative;
      }

      .sub {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 12px;
        font-weight: 700;
        margin: 4px 0 8px;
      }

      .pill {
        background: var(--ink);
        padding: 2px 9px;
        border-radius: 99px;
        color: var(--g);
      }

      .pill.dn {
        color: var(--r);
      }

      .hero svg {
        width: 100%;
        height: 110px;
        display: block;
      }

      .lg {
        font-size: 11px;
        font-weight: 700;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .lg i {
        width: 14px;
        height: 3px;
        background: var(--ink);
      }

      .lg i.d {
        background: none;
        border-top: 3px dashed #0008;
        margin-left: 8px;
      }

      .chips {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 14px 0;
      }

      .chips > div {
        background: var(--p);
        border: 2px solid var(--line);
        border-radius: 14px;
        padding: 9px 10px;
      }

      .chips .k {
        color: var(--m);
        opacity: 1;
      }

      .chips b {
        display: block;
        font: 15px "Bowlby One";
      }

      .moth b {
        color: var(--r);
      }

      u {
        display: block;
        height: 5px;
        background: var(--p2);
        border-radius: 5px;
        margin-top: 5px;
        overflow: hidden;
      }

      u i {
        display: block;
        height: 100%;
        background: var(--g);
        width: 0;
        transition: width 0.4s;
      }

      .capi {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }

      .capi svg {
        width: 62px;
        flex: none;
      }

      .capi.bump svg {
        animation: bump 0.5s;
      }

      @keyframes bump {
        40% {
          transform: translateY(-10px) rotate(-6deg);
        }
      }

      .capi p {
        background: var(--p);
        border: 2px solid var(--line);
        border-radius: 14px 14px 14px 3px;
        padding: 9px 12px;
        font-size: 13px;
      }

      nav {
        display: flex;
        gap: 6px;
        position: sticky;
        top: 0;
        background: var(--ink);
        padding: 8px 0;
        z-index: 5;
      }

      nav button {
        flex: 1;
        padding: 9px;
        border-radius: 11px;
        border: 2px solid var(--line);
        font-weight: 700;
        color: var(--m);
      }

      nav .on {
        background: var(--y);
        color: var(--ink);
        border-color: var(--y);
      }

      .view {
        display: none;
      }

      .view.on {
        display: block;
        animation: in 0.25s;
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      .row {
        display: flex;
        align-items: center;
        gap: 11px;
        background: var(--p);
        border: 2px solid var(--line);
        border-radius: 15px;
        padding: 10px 12px;
        margin-top: 8px;
        width: 100%;
        text-align: left;
      }

      .row:active {
        transform: scale(0.98);
      }

      .tile {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font: 13px "Bowlby One";
        color: var(--ink);
        flex: none;
      }

      .nm {
        flex: 1;
        min-width: 0;
      }

      .nm b {
        display: block;
      }

      .nm small {
        color: var(--m);
        font-size: 11px;
      }

      .spk {
        width: 60px;
        height: 26px;
        flex: none;
      }

      .rt {
        text-align: right;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .rt small {
        display: block;
        font-size: 11px;
      }

      .up {
        color: var(--g);
      }

      .dn {
        color: var(--r);
      }

      h4 {
        font: 12px "Bowlby One";
        letter-spacing: 0.06em;
        color: var(--m);
        margin: 18px 0 2px;
      }

      .bar {
        display: flex;
        height: 16px;
        border-radius: 8px;
        overflow: hidden;
        margin: 10px 0;
        background: var(--p2);
      }

      .bar i {
        transition: width 0.4s;
      }

      .dock {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 22px 16px calc(10px + env(safe-area-inset-bottom));
        background: linear-gradient(transparent, var(--ink) 35%);
        z-index: 6;
      }

      .dock div {
        max-width: 480px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .tb {
        background: var(--p2);
        border: 2px solid var(--line);
        border-radius: 14px;
        padding: 8px 0;
        font-weight: 700;
        font-size: 11px;
        box-shadow: 0 4px 0 #000;
      }

      .tb:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #000;
      }

      .tb.pri {
        background: var(--y);
        color: var(--ink);
        border-color: var(--y);
      }

      .tb b {
        display: block;
        font: 15px "Bowlby One";
      }

      #sheet {
        position: fixed;
        inset: 0;
        background: #000b;
        display: none;
        align-items: flex-end;
        z-index: 9;
      }

      #sheet.on {
        display: flex;
      }

      #sc {
        width: 100%;
        max-width: 480px;
        margin: auto;
        background: var(--p);
        border: 2px solid var(--line);
        border-bottom: 0;
        border-radius: 24px 24px 0 0;
        padding: 14px 18px calc(20px + env(safe-area-inset-bottom));
        max-height: 92vh;
        overflow: auto;
        animation: up 0.3s cubic-bezier(0.2, 1.2, 0.4, 1);
      }

      @keyframes up {
        from {
          transform: translateY(100%);
        }
      }

      .grip {
        display: block;
        width: 40px;
        height: 4px;
        background: var(--line);
        border-radius: 4px;
        margin: 0 auto 12px;
      }

      .tag {
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--y);
      }

      h2 {
        font: 24px/1.1 "Bowlby One";
        margin: 4px 0 8px;
      }

      .op,
      .cta {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 13px;
        border-radius: 14px;
        border: 2px solid var(--line);
        background: var(--p2);
        font-weight: 700;
        text-align: left;
      }

      .cta {
        background: var(--y);
        color: var(--ink);
        border-color: var(--y);
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .cta[disabled] {
        opacity: 0.4;
      }

      .cta i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: #fff6;
      }

      .cta span {
        position: relative;
      }

      .box {
        background: var(--p2);
        border-radius: 12px;
        padding: 10px 12px;
        margin: 10px 0;
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 10px 0;
      }

      .grid div {
        background: var(--p2);
        border-radius: 12px;
        padding: 8px 10px;
        font-weight: 700;
      }

      .grid small {
        display: block;
        color: var(--m);
        font-size: 10px;
        letter-spacing: 0.1em;
      }

      .rg {
        display: flex;
        gap: 6px;
        margin: 6px 0;
      }

      .rg button {
        flex: 1;
        padding: 7px;
        border-radius: 9px;
        border: 2px solid var(--line);
        font-size: 12px;
        font-weight: 700;
      }

      .rg .on {
        background: var(--y);
        color: var(--ink);
        border-color: var(--y);
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--y);
        margin: 8px 0 2px;
      }

      .amt {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-weight: 700;
      }

      .amt b {
        font: 22px "Bowlby One";
      }

      #sch {
        width: 100%;
        height: 120px;
        display: block;
        margin: 8px 0;
      }

      .eff {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
      }

      .log {
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }

      .log small {
        color: var(--m);
      }

      .c {
        position: fixed;
        top: -10px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        animation: fall 1.6s ease-in forwards;
        z-index: 20;
        pointer-events: none;
      }

      @keyframes fall {
        to {
          transform: translateY(105vh) rotate(540deg);
        }
      }

      .fl {
        position: fixed;
        font: 20px "Bowlby One";
        pointer-events: none;
        z-index: 21;
        animation: fl 1s ease-out forwards;
      }

      @keyframes fl {
        to {
          transform: translateY(-60px);
          opacity: 0;
        }
      }

      body.fg::after,
      body.fr::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 15;
        animation: fa 0.7s ease-out forwards;
      }

      body.fg::after {
        box-shadow: inset 0 0 90px 10px #3ddc8466;
      }

      body.fr::after {
        box-shadow: inset 0 0 90px 10px #ff4d4d77;
      }

      @keyframes fa {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }

      .shake {
        animation: sh 0.4s;
      }

      @keyframes sh {
        20% {
          transform: translateX(-8px);
        }

        40% {
          transform: translateX(7px);
        }

        60% {
          transform: translateX(-5px);
        }

        80% {
          transform: translateX(3px);
        }
      }

      #toast {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translate(-50%, -90px);
        background: var(--y);
        color: var(--ink);
        font-weight: 700;
        padding: 10px 16px;
        border-radius: 12px;
        z-index: 30;
        transition: transform 0.3s;
        max-width: 90%;
        text-align: center;
        box-shadow: 3px 3px 0 #7a6700;
      }

      #toast.on {
        transform: translate(-50%, 0);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="w" id="app">
      <header>
        <div class="brand">GRANA<em>VIVA</em></div>
        <div class="date">
          <b id="dt">1 JAN</b><span id="dn">dia 1 de 365</span>
        </div>
        <button class="ib" id="snd" aria-label="Som">♪</button>
      </header>
      <div class="prog"><i id="pr"></i></div>
      <section class="hero">
        <small class="k">PATRIMÔNIO</small>
        <div class="big" id="tot">R$ 5.000</div>
        <div class="sub">
          <span class="pill" id="dlt">+0,0%</span
          ><span id="real">real R$ 5.000</span>
        </div>
        <svg id="ch" viewBox="0 0 340 110" preserveAspectRatio="none"></svg>
        <div class="lg"><i></i>você<i class="d"></i>colchão (sem investir)</div>
      </section>
      <section class="chips">
        <div><small class="k">CAIXA</small><b id="cash">R$ 5.000</b></div>
        <div>
          <small class="k">RESERVA</small><b id="res">1,8 m</b
          ><u><i id="rb"></i></u>
        </div>
        <div class="moth">
          <small class="k">TRAÇA COMEU</small><b id="eat">R$ 0</b>
        </div>
      </section>
      <section class="capi" id="capi">
        <svg viewBox="0 0 64 56">
          <ellipse cx="30" cy="38" rx="25" ry="15" fill="#a9733f" />
          <circle cx="48" cy="25" r="13" fill="#bd8650" />
          <ellipse cx="57" cy="29" rx="7" ry="5.5" fill="#6b4423" />
          <circle cx="42" cy="13" r="4" fill="#a9733f" />
          <rect x="40" y="20" width="14" height="6" rx="3" fill="#0e0e0c" />
          <rect x="40" y="21" width="5" height="1.5" fill="#ffd400" />
          <circle cx="58" cy="28" r="1" fill="#0e0e0c" />
          <rect x="12" y="48" width="5" height="7" rx="2" fill="#6b4423" />
          <rect x="38" y="48" width="5" height="7" rx="2" fill="#6b4423" />
        </svg>
        <p id="say"></p>
      </section>
      <nav id="tabs">
        <button class="on" data-t="m">Mercado</button
        ><button data-t="c">Carteira</button><button data-t="r">Radar</button>
      </nav>
      <main>
        <div class="view on" id="v-m"></div>
        <div class="view" id="v-c"></div>
        <div class="view" id="v-r"></div>
      </main>
    </div>
    <div class="dock">
      <div>
        <button class="tb pri" data-n="1"><b>+1</b>dia</button
        ><button class="tb" data-n="7"><b>+7</b>semana</button
        ><button class="tb" data-n="30"><b>+30</b>mês</button
        ><button class="tb" data-n="90"><b>»</b>até evento</button>
      </div>
    </div>
    <div id="sheet">
      <div id="sc"></div>
    </div>
    <div id="toast"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        $$ = (s) => [...document.querySelectorAll(s)];
      const R$ = (n) =>
        n.toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
          maximumFractionDigits: 0,
        });
      const pc = (n) =>
        (n >= 0 ? "+" : "") + n.toFixed(1).replace(".", ",") + "%";
      const g = () => {
        let u = 0,
          v = 0;
        while (!u) u = Math.random();
        while (!v) v = Math.random();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283 * v);
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const MES = [
        "JAN",

      const A = [

        {

        } else {
          flash("fr");
          floatText("−" + R$(old - now));
          sfx("low");
          say(
            pick([
              "Caiu " + pc(ch * 100) + ". Quem tem reserva dorme bem.",
              "Oscilar faz parte. Vender no susto, não.",
            ]),
          );
          if (ch < -0.025) {
            $("#app").classList.add("shake");
            setTimeout(() => $("#app").classList.remove("shake"), 400);
            vib([60, 40, 60]);
          }
        }
        [10000, 15000, 25000, 50000].forEach((m) => {
          if (old < m && now >= m) {
            confetti(70);
            toast("Marco: " + R$(m) + " de patrimônio!");
            sfx("win");
            S.xp += 50;
          }
        });
      }

      function modal(ev) {
        return new Promise((res) => {
          if (ev.say) say(ev.say);
          openSheet(
            `<div class="tag">${ev.tag}</div><h2>${ev.title}</h2><p>${ev.txt}</p>${ev.html || ""}${ev.hold ? '<button class="cta" id="hold"><i></i><span>SEGURE PARA NÃO VENDER</span></button>' : ""}${ev.opts.map((o, i) => `<button class="op" data-i="${i}">${o.l}</button>`).join("")}`,
          );
          $$("#sc .op").forEach(
            (b) =>
              (b.onclick = () => {
                const m = ev.opts[b.dataset.i].go();
                closeSheet();
                if (m) toast(m);
                render();
                res();
              }),
          );
          if (ev.hold) {
            const b = $("#hold"),
              f = b.querySelector("i");
            let t0 = 0,
              raf;
            const stop = () => {
              cancelAnimationFrame(raf);
              if (!t0) return;
              t0 = 0;
              f.style.width = 0;
              Object.keys(S.pos)
                .filter((i) => ["acoes", "fii", "etf", "cripto"].includes(i))
                .forEach((i) => sell(i, 1));
              closeSheet();
              toast("Vendeu no fundo. Prejuízo realizado.");
              sfx("low");
              render();
              res();
            };
            b.onpointerdown = () => {
              t0 = performance.now();
              (function s(t) {
                const p = (t - t0) / 2000;
                f.style.width = Math.min(100, p * 100) + "%";
                if (!t0) return;
                if (p >= 1) {
                  t0 = 0;
                  closeSheet();
                  S.xp += 40;
                  S.sent += 0.004;
                  toast("Mão de diamante! +40 XP");
                  confetti(50);
                  sfx("win");
                  render();
                  res();
                } else raf = requestAnimationFrame(s);
              })(t0);
            };
            b.onpointerup = b.onpointerleave = stop;
          }
        });
      }
      function openAsset(id, range = 90) {
        const a = ast(id),
          p = pos(id),
          max = Math.floor(S.cash),
          ch = (a.p / a.h[Math.max(0, a.h.length - 31)] - 1) * 100;
        openSheet(`<div style="display:flex;gap:12px;align-items:center"><div class="tile" style="background:${a.c}">${a.m}</div><div style="flex:1"><h2 style="margin:0;font-size:20px">${a.n}</h2><small style="color:var(--m)">${a.rf ? "RENDA FIXA" : "RENDA VARIÁVEL"}</small></div><div class="rt">${a.p.toFixed(1).replace(".", ",")}<small class="${ch >= 0 ? "up" : "dn"}">${pc(ch)} em 30d</small></div></div>
  <svg id="sch" viewBox="0 0 340 120" preserveAspectRatio="none"></svg>
  <div class="rg">${[
    [30, "30d"],
    [90, "90d"],
    [999, "Tudo"],
  ]
    .map(
      ([r, l]) =>
        `<button data-r="${r}" class="${r === range ? "on" : ""}">${l}</button>`,
    )
    .join("")}</div>
  <p>${a.d}</p>
  <div class="grid"><div><small>RENDE</small>${a.rf ? "~" + a.y(S).toFixed(1).replace(".", ",") + "% a.a." : "variável"}</div><div><small>RISCO</small>${a.risk}</div><div><small>RESGATE</small>${a.liq}</div><div><small>IMPOSTO</small>${a.ir ? "15% sobre o lucro" : "isento"}</div></div>
  ${S.why[id] ? `<div class="box"><b>Por que mexeu?</b> ${S.why[id]}</div>` : ""}
  <div class="box"><b>Dica do Capi:</b> ${a.tip}</div>
  <div class="amt"><span>Investir</span><b id="av">${R$(Math.min(500, max))}</b></div>
  <input type="range" id="sl" min="0" max="${Math.max(50, max)}" step="50" value="${Math.min(500, max)}">
  <div class="rg"><button data-q="100">R$ 100</button><button data-q="500">R$ 500</button><button data-q="1000">R$ 1.000</button><button data-q="max">Tudo</button></div>
  <button class="cta" id="bb"><span>Comprar</span></button>
  ${p.u ? `<button class="op" data-s=".5">Vender metade (${R$(val(id) * 0.5)} brutos)</button><button class="op" data-s="1">Vender tudo (${R$(val(id))} brutos, IR descontado no resgate)</button>` : ""}
  <button class="op" id="cl" style="text-align:center;color:var(--m)">Fechar</button>`);
        line(
          $("#sch"),
          [{ d: a.h.slice(-range), c: a.c, fill: a.c + "22" }],
          null,
          120,
        );
        $$("[data-r]").forEach(
          (b) => (b.onclick = () => openAsset(id, +b.dataset.r)),
        );
        const sl = $("#sl");
        sl.oninput = () => ($("#av").textContent = R$(+sl.value));
        $$("[data-q]").forEach(
          (b) =>
            (b.onclick = () => {
              sl.value =
                b.dataset.q === "max" ? max : Math.min(max, b.dataset.q);
              sl.oninput();
              sfx("tick");
            }),
        );
        $("#bb").onclick = () => {
          const v = +sl.value;
          if (v < 50) return toast("Mínimo de R$ 50");
          if (v > S.cash) return toast("Sem caixa suficiente");
          const first = !S.seen.b;
          S.seen.b = 1;
          buy(id, v);
          S.xp += 15;
          closeSheet();
          sfx("ka");
          confetti(first ? 60 : 20, [a.c, "#ffd400"]);
          vib(30);
          say(
            "Plantou " +
              R$(v) +
              " em " +
              a.n +
              ". Agora é deixar o tempo trabalhar.",
          );
          toast(first ? "Primeiro investimento! +15 XP" : "Comprado: " + a.n);
          render();
        };
        $$("[data-s]").forEach(
          (b) =>
            (b.onclick = () => {
              const n = sell(id, +b.dataset.s);
              closeSheet();
              sfx("ka");
              toast("Resgate líquido: " + R$(n));
              render();
            }),
        );
        $("#cl").onclick = closeSheet;
      }

      async function run(n) {
        if (S.busy) return;
        S.busy = true;
        const old = total();
        let q = [];
        for (let i = 0; i < n && S.day < 365; i++) {
          q = tick();
          render();
          if (i % 2 === 0) sfx("tick");
          await sleep(n > 10 ? 16 : 60);
          if (q.length) break;
        }
        S.busy = false;
        juice(old, total());
        for (const ev of q) await modal(ev);
        if (S.pendingForced) {
          S.pendingForced = 0;
          await modal(forcedEv("o imprevisto"));
        }
        if (S.day >= 365) endGame();
      }

      function endGame() {
        const t = total(),
          real = t / (1 + S.ipca / 100),
          rv = RIV.map((r) => ({ n: r.n, v: rval(r) })),
          best = Math.max(...rv.map((r) => r.v)),
          cls = Object.keys(S.pos).length;
        const medal =
          t > best
            ? "OURO"
            : t > rv[0].v
              ? "PRATA"
              : t > S.mattress
                ? "BRONZE"
                : "SEM MEDALHA";
        const lessons = [
          cls < 3
            ? "Você concentrou o dinheiro em poucos ativos. Diversificar reduz o risco sem matar o retorno."
            : "Boa diversificação: você não colocou todos os ovos na mesma cesta.",
          S.forced
            ? "Você precisou vender ativos à força. Reserva de emergência evita isso."
            : "Nenhuma venda forçada: sua reserva fez o trabalho dela.",
          S.eaten > 600
            ? "A traça comeu " +
              R$(S.eaten) +
              " de dinheiro parado. Caixa sem rendimento perde para a inflação."
            : "Pouco dinheiro parado: a traça passou fome.",
        ];
        confetti(90);
        sfx("win");
        openSheet(
          `<div class="tag">FIM DO ANO · 365 DIAS</div><h2>${medal}</h2><p>Você terminou com <b style="color:var(--y)">${R$(t)}</b> (${R$(real)} em poder de compra). Sem investir nada, teria ${R$(S.mattress)}.</p><div class="box">${rv.map((r) => `<div class="eff"><span>${r.n}</span><span>${R$(r.v)}</span></div>`).join("")}</div>${lessons.map((l) => `<div class="box">${l}</div>`).join("")}<button class="cta" onclick="location.reload()"><span>Jogar de novo</span></button><p style="font-size:11px;color:var(--m);margin-top:10px">Tudo aqui é simulado e educativo. Não é recomendação de investimento.</p>`,
        );
      }

      $$(".tb").forEach((b) => (b.onclick = () => run(+b.dataset.n)));
      $$("#tabs button").forEach(
        (b) =>
          (b.onclick = () => {
            $$("#tabs button").forEach((x) =>
              x.classList.toggle("on", x === b),
            );
            S.tab = b.dataset.t;
            $$(".view").forEach((v) =>
              v.classList.toggle("on", v.id === "v-" + S.tab),
            );
            render();
            sfx("tick");
          }),
      );
      $("#snd").onclick = () => {
        S.snd = !S.snd;
        $("#snd").style.opacity = S.snd ? 1 : 0.35;
      };
      $("#sheet").onclick = (e) => {
        if (e.target.id === "sheet" && !$("#hold")) closeSheet();
      };
      S.tab = "m";
      render();
      say("Você tem R$ 5.000 e 365 dias. A traça já está de olho no caixa.");
      openSheet(
        `<div class="tag">BEM-VINDO</div><h2>365 dias. R$ 5.000. Uma traça faminta.</h2><p>Dinheiro parado perde valor todo dia. Seu objetivo: terminar o ano com mais poder de compra que os três rivais.</p><div class="box">Todo dia 1 vêm as contas (R$ 2.800). Todo dia 5, o salário (R$ 4.000). No meio disso, juros, notícias e primos com dicas quentes. Use <b>+1, +7, +30</b> ou <b>»</b> para pular até o próximo evento.</div><button class="cta" id="go"><span>Começar o ano</span></button>`,
      );
      $("#go").onclick = () => {
        closeSheet();
        sfx("ka");
      };
    </script>
  </body>
</html>
